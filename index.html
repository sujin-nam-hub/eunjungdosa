<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은정도사 · 귀여운 사주 & 커플 궁합</title>
<style>
  :root{
    --pink:#ff8fab; --pink-d:#ff6f91; --pink-s:#ffe0e9;
    --lav:#b79cf0; --lav-s:#ece3ff; --mint:#79dab0; --mint-s:#dcf7ec;
    --yellow:#ffd36b; --cream:#fff8ef; --ink:#5b4a63; --sub:#a294ad; --line:#f0e6f2;
    --wood:#57cf8b; --fire:#ff8f6b; --earth:#f0c04a; --metal:#b9c2cc; --water:#6bb8f0;
    --b0:#f5a35a; --b1:#7fb4ef; --b2:#5fcf9a; --b3:#ff7a9c;
  }
  *{box-sizing:border-box}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
    background:linear-gradient(160deg,#fff0f6 0%,#f3ecff 55%,#eafaf3 100%);
    background-attachment:fixed;margin:0;padding:20px 16px 60px;color:var(--ink);}
  .wrap{max-width:600px;margin:0 auto;}
  /* 헤더 & 마스코트 */
  .hero{text-align:center;margin-bottom:16px;}
  .mascot{font-size:60px;line-height:1;filter:drop-shadow(0 6px 10px rgba(255,143,171,.35));animation:bob 2.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .hero h1{font-size:24px;margin:6px 0 2px;letter-spacing:-.5px;}
  .bubble{display:inline-block;background:#fff;border-radius:16px;padding:8px 14px;font-size:13px;color:var(--sub);
    box-shadow:0 4px 14px rgba(183,156,240,.18);margin-top:8px;position:relative;}
  .bubble:before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:#fff;border-radius:2px;}
  /* 탭 */
  .tabs{display:flex;gap:8px;background:#fff;padding:6px;border-radius:18px;box-shadow:0 6px 18px rgba(183,156,240,.15);margin-bottom:18px;}
  .tab{flex:1;text-align:center;padding:11px 3px;border-radius:14px;font-weight:800;font-size:13px;color:var(--sub);cursor:pointer;transition:.2s;white-space:nowrap;}
  .tab.on{background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;box-shadow:0 6px 14px rgba(255,143,171,.35);}
  /* 카드/폼 */
  .card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(183,156,240,.16);margin-bottom:16px;}
  .card h3{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px;}
  .card h3 .em{font-size:19px;}
  .card h3 .sm{font-weight:500;color:#b7aac0;font-size:12.5px;margin-left:auto;}
  label{display:block;margin:0 0 6px;font-weight:700;color:var(--sub);font-size:13px;}
  input,select,button{font-family:inherit;}
  input,select{width:100%;padding:0 14px;border:2px solid var(--line);border-radius:14px;font-size:15px;color:var(--ink);background:#fdfbff;transition:.15s;box-sizing:border-box;height:50px;line-height:normal;}
  input[type="date"],input[type="month"]{-webkit-appearance:none;appearance:none;}
  select{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23a294ad' d='M1 1l5 5 5-5'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:34px;}
  input:focus,select:focus{outline:none;border-color:var(--pink);background:#fff;}
  .fg{margin-bottom:13px;}
  .row{display:flex;gap:10px;}.row>div{flex:1;}
  .person-tag{display:inline-block;font-size:12px;font-weight:800;padding:4px 12px;border-radius:999px;margin-bottom:12px;}
  .pa{background:var(--pink-s);color:var(--pink-d);}
  .pb{background:var(--lav-s);color:#7c5fd0;}
  button.go{width:100%;background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;border:none;
    padding:16px;border-radius:16px;font-size:16.5px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(255,143,171,.4);transition:.15s;}
  button.go:active{transform:scale(.98);}
  .hidden{display:none;}
  /* 결과 공통 */
  .sec{background:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(183,156,240,.14);margin-bottom:14px;}
  .sec h4{margin:0 0 12px;font-size:15.5px;display:flex;align-items:center;gap:7px;}
  .sec h4 .em{font-size:18px;}
  .sec h4 .sm{font-weight:500;color:#b7aac0;font-size:12px;margin-left:auto;}
  .txt{font-size:14px;line-height:1.75;color:#6b5c72;}
  .txt b{color:var(--ink);}
  .tag{display:inline-block;background:var(--cream);border:1.5px solid #f3ead9;border-radius:999px;padding:4px 11px;font-size:12px;margin:3px 4px 0 0;color:#a58b5e;font-weight:700;}
  .tag.good{background:var(--mint-s);border-color:#cdeede;color:#3ba576;}
  .tag.warn{background:#fff0f0;border-color:#ffdada;color:#e06a6a;}
  /* 사주 기둥 */
  .pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;}
  .pillar .pl{font-size:11px;color:var(--sub);margin-bottom:6px;font-weight:700;}
  .gz{border-radius:14px;padding:9px 3px;color:#fff;font-weight:800;line-height:1.25;}
  .gz .h{font-size:23px;}.gz .k{font-size:11px;opacity:.92;}
  .gz.stem{margin-bottom:5px;}
  .el-목{background:var(--wood)}.el-화{background:var(--fire)}.el-토{background:var(--earth)}
  .el-금{background:var(--metal)}.el-수{background:var(--water)}
  /* 오행바 */
  .bar{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
  .bar .n{width:52px;font-weight:800;font-size:13px;}
  .bar .t{flex:1;background:#f2ecf6;border-radius:8px;height:15px;overflow:hidden;}
  .bar .f{height:100%;border-radius:8px;transition:width .6s;}
  .bar .c{width:24px;text-align:right;color:var(--sub);font-size:12px;}
  /* 점수 배지 */
  .scorebox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .badge{flex:0 0 auto;width:100px;height:100px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.12);}
  .badge .num{font-size:30px;font-weight:900;line-height:1;}
  .badge .lb{font-size:12px;margin-top:3px;font-weight:700;opacity:.95;}
  .scorebox .bd{flex:1;min-width:200px;}
  .hearts{font-size:18px;letter-spacing:1px;}
  /* 분야별 카드 */
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
  .mini{background:#fdfbff;border:2px solid var(--line);border-radius:16px;padding:13px;}
  .mini .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .mini .nm{font-weight:800;font-size:14px;}.mini .sc{font-weight:900;font-size:15px;}
  .mini .st{font-size:13px;margin-bottom:5px;}
  .mini .ds{font-size:12.5px;line-height:1.55;color:#7b6c82;}
  /* 궁합 두 사람 요약 */
  .duo{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;}
  .who{background:#fdfbff;border:2px solid var(--line);border-radius:16px;padding:12px 6px;}
  .who .av{font-size:30px;}.who .nn{font-weight:800;font-size:14px;margin:4px 0 2px;}
  .who .ilju{display:inline-block;font-size:12px;color:#fff;padding:3px 9px;border-radius:999px;font-weight:800;}
  .heart-mid{font-size:26px;animation:beat 1.3s ease-in-out infinite;}
  @keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.25)}}
  .lucky{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;text-align:center;}
  .lucky .it{background:#fdfbff;border:2px solid var(--line);border-radius:16px;padding:12px 4px;}
  .lucky .it .k{font-size:11.5px;color:var(--sub);font-weight:700;}
  .lucky .it .v{font-size:15px;font-weight:900;margin-top:3px;}
  details{background:#fff;border-radius:18px;padding:2px 18px;box-shadow:0 6px 18px rgba(183,156,240,.12);margin-bottom:14px;}
  summary{cursor:pointer;padding:14px 0;font-weight:800;font-size:14.5px;list-style:none;}
  summary::-webkit-details-marker{display:none;}
  .warnbox{font-size:12px;color:#c96;background:#fffaf0;border:1.5px solid #ffe6b0;border-radius:12px;padding:9px 11px;margin:4px 0 12px;line-height:1.5;}
  button.ai{width:100%;background:var(--ink);color:#fff;border:none;padding:13px;border-radius:14px;font-weight:800;cursor:pointer;margin:4px 0 12px;}
  button.ai:disabled{opacity:.5;}
  #aiOut{white-space:pre-wrap;font-size:14px;line-height:1.8;color:#6b5c72;}
  .note{font-size:11.5px;color:#b7aac0;text-align:center;margin-top:14px;line-height:1.7;}
  /* 채팅 */
  .chat-log{background:#faf6ff;border:2px solid var(--line);border-radius:16px;padding:12px;min-height:200px;max-height:360px;overflow-y:auto;margin-bottom:10px;}
  .cmsg{max-width:82%;padding:9px 13px;border-radius:16px;margin-bottom:8px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
  .cmsg.user{background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;margin-left:auto;border-bottom-right-radius:5px;}
  .cmsg.bot{background:#fff;color:#6b5c72;border:1.5px solid var(--line);border-bottom-left-radius:5px;}
  .chat-input-row{display:flex;gap:8px;}
  .chat-input-row input{flex:1;}
  .chat-send{background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;border:none;border-radius:14px;width:54px;font-size:18px;font-weight:800;cursor:pointer;}
  .chip-row{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}
  .chip{background:var(--lav-s);color:#7c5fd0;border:none;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .taek .mini{margin-bottom:9px;}
  .taek .mini.bad{border-color:#ffd6d6;background:#fff6f6;}
  @media(max-width:380px){
    body{padding:16px 12px 50px;}
    .card,.sec{padding:16px;}
    .tab{font-size:12px;padding:10px 2px;}
    .scorebox{gap:12px;}
    .badge{width:88px;height:88px;}
    .badge .num{font-size:26px;}
  }
  @media print{
    body{background:#fff;padding:0;}
    .tabs,.card,.hero .bubble,.mascot,.no-print,details{display:none!important;}
    .hero h1{margin:0 0 10px;}
    .sec{box-shadow:none;border:1px solid #eee;break-inside:avoid;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="mascot">🐯</div>
    <h1>은정도사 🔮</h1>
    <div class="bubble" id="bubble">어서 오라랑~ 은정도사가 봐주겠다랑! 🔮</div>
  </div>

  <div class="tabs">
    <div class="tab on" id="tab-btn-0" onclick="switchTab(0)">🔮 사주</div>
    <div class="tab" id="tab-btn-1" onclick="switchTab(1)">💑 궁합</div>
    <div class="tab" id="tab-btn-2" onclick="switchTab(2)">📅 택일</div>
    <div class="tab" id="tab-btn-3" onclick="switchTab(3)">🐯 질문</div>
  </div>

  <!-- ===== 탭0: 내 사주 ===== -->
  <div id="tab-0">
    <div class="card">
      <h3><span class="em">🌸</span> 내 정보 입력 <span class="sm">양력 기준</span></h3>
      <div class="fg"><label>이름 / 별명</label><input type="text" id="me-name" placeholder="이름을 적어줘랑"></div>
      <div class="row">
        <div class="fg"><label>생년월일</label><input type="date" id="me-bd" min="1900-01-01" max="2100-12-31"></div>
        <div class="fg"><label>성별</label><select id="me-gender"><option value="남">남자</option><option value="여">여자</option></select></div>
      </div>
      <div class="fg"><label>태어난 시간</label>
        <select id="me-time">
          <option value="unknown">몰라요</option>
          <option value="子">자시 (23:30~01:29)</option><option value="丑">축시 (01:30~03:29)</option>
          <option value="寅">인시 (03:30~05:29)</option><option value="卯">묘시 (05:30~07:29)</option>
          <option value="辰">진시 (07:30~09:29)</option><option value="巳">사시 (09:30~11:29)</option>
          <option value="午">오시 (11:30~13:29)</option><option value="未">미시 (13:30~15:29)</option>
          <option value="申">신시 (15:30~17:29)</option><option value="酉">유시 (17:30~19:29)</option>
          <option value="戌">술시 (19:30~21:29)</option><option value="亥">해시 (21:30~23:29)</option>
        </select>
      </div>
      <button class="go" onclick="calcMe()">🐾 내 운세 보기</button>
    </div>
    <div id="result-me"></div>
  </div>

  <!-- ===== 탭1: 커플 궁합 ===== -->
  <div id="tab-1" class="hidden">
    <div class="card">
      <h3><span class="em">💘</span> 두 사람 정보 <span class="sm">양력 기준</span></h3>
      <span class="person-tag pa">첫 번째 사람 💗</span>
      <div class="fg"><label>이름 / 별명</label><input type="text" id="a-name" placeholder="예: 나"></div>
      <div class="row">
        <div class="fg"><label>생년월일</label><input type="date" id="a-bd" min="1900-01-01" max="2100-12-31"></div>
        <div class="fg"><label>성별</label><select id="a-gender"><option value="남">남자</option><option value="여">여자</option></select></div>
      </div>
      <div class="fg"><label>태어난 시간</label>
        <select id="a-time">
          <option value="unknown">몰라요</option>
          <option value="子">자시</option><option value="丑">축시</option><option value="寅">인시</option><option value="卯">묘시</option>
          <option value="辰">진시</option><option value="巳">사시</option><option value="午">오시</option><option value="未">미시</option>
          <option value="申">신시</option><option value="酉">유시</option><option value="戌">술시</option><option value="亥">해시</option>
        </select>
      </div>
      <hr style="border:none;border-top:2px dashed var(--line);margin:16px 0;">
      <span class="person-tag pb">두 번째 사람 💜</span>
      <div class="fg"><label>이름 / 별명</label><input type="text" id="b-name" placeholder="예: 상대"></div>
      <div class="row">
        <div class="fg"><label>생년월일</label><input type="date" id="b-bd" min="1900-01-01" max="2100-12-31"></div>
        <div class="fg"><label>성별</label><select id="b-gender"><option value="여">여자</option><option value="남">남자</option></select></div>
      </div>
      <div class="fg"><label>태어난 시간</label>
        <select id="b-time">
          <option value="unknown">몰라요</option>
          <option value="子">자시</option><option value="丑">축시</option><option value="寅">인시</option><option value="卯">묘시</option>
          <option value="辰">진시</option><option value="巳">사시</option><option value="午">오시</option><option value="未">미시</option>
          <option value="申">신시</option><option value="酉">유시</option><option value="戌">술시</option><option value="亥">해시</option>
        </select>
      </div>
      <button class="go" onclick="calcCouple()">💞 궁합 보기</button>
    </div>
    <div id="result-couple"></div>
  </div>

  <!-- ===== 탭2: 택일 ===== -->
  <div id="tab-2" class="hidden">
    <div class="card">
      <h3><span class="em">📅</span> 좋은 날 잡기 <span class="sm">택일</span></h3>
      <div class="fg"><label>내 생년월일 (양력)</label><input type="date" id="taek-bd" min="1900-01-01" max="2100-12-31"></div>
      <div class="row">
        <div class="fg"><label>무슨 일이에요?</label>
          <select id="taek-event">
            <option value="이사">🏠 이사</option><option value="결혼">💍 결혼·상견례</option>
            <option value="개업">🏪 개업·창업</option><option value="계약">📝 중요한 계약</option>
            <option value="여행">✈️ 여행·출발</option><option value="시험">📚 시험·면접</option>
          </select></div>
        <div class="fg"><label>언제쯤?</label><input type="month" id="taek-ym"></div>
      </div>
      <button class="go" onclick="calcTaekil()">🍀 좋은 날 찾기</button>
    </div>
    <div id="result-taekil"></div>
  </div>

  <!-- ===== 탭3: 은정도사에게 물어봐 ===== -->
  <div id="tab-3" class="hidden">
    <div class="card">
      <h3><span class="em">🐯</span> 은정도사에게 물어봐</h3>
      <div id="chat-log" class="chat-log"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="예: 요즘 연애운 어때?" onkeydown="if(event.key==='Enter')chatSend()">
        <button class="chat-send" onclick="chatSend()">▶</button>
      </div>
      <div class="chip-row" id="chat-chips"></div>
    </div>
  </div>

  <p class="note">
    ※ 절기(절입)를 근사치로 계산하므로 월초·2월 초 경계일 출생자는 오차가 있을 수 있어요.<br>
    재미로 보는 콘텐츠예요. 중요한 결정의 근거로 삼지 말아줘랑 🐯
  </p>
</div>

<script>
/* ================= 데이터 ================= */
const STEMS=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const STEMS_KO=['갑','을','병','정','무','기','경','신','임','계'];
const BRANCH=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const BRANCH_KO=['자','축','인','묘','진','사','오','미','신','유','술','해'];
const ANIMAL=['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
const STEM_EL=['목','목','화','화','토','토','금','금','수','수'];
const BRANCH_EL=['수','토','목','목','토','화','화','토','금','금','토','수'];
const STEM_YY=['양','음','양','음','양','음','양','음','양','음'];
const EL_HANJA={목:'木',화:'火',토:'土',금:'金',수:'水'};
const GEN={목:'화',화:'토',토:'금',금:'수',수:'목'};
const CON={목:'토',토:'수',수:'화',화:'금',금:'목'};
const ELS=['목','화','토','금','수'];

/* ================= 만세력 ================= */
function toJDN(y,m,d){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
const JDN_JIAZI=toJDN(2000,1,7);
function dayPillar(y,m,d){const i=(((toJDN(y,m,d)-JDN_JIAZI)%60)+60)%60;return {s:i%10,b:i%12};}
function effYear(y,m,d){return (m<2||(m===2&&d<4))?y-1:y;}
function yearPillar(y){return {s:((y-4)%10+10)%10,b:((y-4)%12+12)%12};}
const TERM_DAY={1:6,2:4,3:6,4:5,5:6,6:6,7:7,8:8,9:8,10:8,11:7,12:7};
function monthOrder(m,d){let o=(m===1)?11:(m-2);if(d<TERM_DAY[m])o=(o+11)%12;return o;}
function monthPillar(ys,m,d){const o=monthOrder(m,d);const f=((ys%5)*2+2)%10;return {s:(f+o)%10,b:(o+2)%12};}
function hourPillar(ds,hb){const f=(ds%5)*2%10;return {s:(f+hb)%10,b:hb};}
function computeChart(y,m,d,ht){
  const dp=dayPillar(y,m,d),yp=yearPillar(effYear(y,m,d)),mp=monthPillar(yp.s,m,d);
  const hp=(ht!=='unknown')?hourPillar(dp.s,BRANCH.indexOf(ht)):null;
  const cnt={목:0,화:0,토:0,금:0,수:0};
  const add=(s,b)=>{cnt[STEM_EL[s]]++;cnt[BRANCH_EL[b]]++;};
  add(yp.s,yp.b);add(mp.s,mp.b);add(dp.s,dp.b);if(hp)add(hp.s,hp.b);
  return {yp,mp,dp,hp,cnt,dayEl:STEM_EL[dp.s],total:hp?8:6};
}

function tenGod(dayEl,el){
  if(el===dayEl)return '비겁';
  if(GEN[dayEl]===el)return '식상';
  if(CON[dayEl]===el)return '재성';
  if(CON[el]===dayEl)return '관성';
  if(GEN[el]===dayEl)return '인성';
}
const SIXHAP={0:1,1:0,2:11,11:2,3:10,10:3,4:9,9:4,5:8,8:5,6:7,7:6};
const SAMHAP=[[8,0,4],[2,6,10],[5,9,1],[11,3,7]];
const HAE=[[0,7],[1,6],[2,5],[3,4],[8,11],[9,10]];
const PA=[[0,9],[1,4],[2,11],[3,6],[5,8],[10,7]];
function inSamhap(a,b){return SAMHAP.some(g=>g.includes(a)&&g.includes(b)&&a!==b);}
function inPairs(list,a,b){return list.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));}
function branchRel(a,b){if((a+6)%12===b)return '충';if(SIXHAP[a]===b)return '합';return '';}

/* ================= 유사난수(날짜 고정) ================= */
function hseed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rand01(s){return (hseed(s)%10000)/10000;}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function stars(sc){const n=clamp(Math.round(sc/20),1,5);return '★'.repeat(n)+'☆'.repeat(5-n);}
function hearts(sc){const n=clamp(Math.round(sc/20),1,5);return '💖'.repeat(n)+'🤍'.repeat(5-n);}
function band(sc){return sc>=80?3:sc>=65?2:sc>=48?1:0;}
const BAND_LABEL=['조심','보통','좋음','대길'];
const BAND_C=['--b0','--b1','--b2','--b3'];
function bcol(sc){return getComputedStyle(document.documentElement).getPropertyValue(BAND_C[band(sc)]).trim();}
function gz(p){return STEMS[p.s]+BRANCH[p.b];}
function gzHTML(s,b){const se=STEM_EL[s],be=BRANCH_EL[b];
  return `<div class="gz stem el-${se}"><div class="h">${STEMS[s]}</div><div class="k">${STEMS_KO[s]}·${se}</div></div>`+
         `<div class="gz el-${be}"><div class="h">${BRANCH[b]}</div><div class="k">${BRANCH_KO[b]}·${be}</div></div>`;}

function daeun(y,m,d,gender,yp,mp,dayEl){
  const yang=STEM_YY[yp.s]==='양';
  const fwd=(yang&&gender==='남')||(!yang&&gender==='여');   // 양남음녀=순행
  const jb=toJDN(y,m,d);let days;
  if(fwd){let nm=m,ny=y;if(d>=TERM_DAY[m]){nm=m+1;if(nm>12){nm=1;ny=y+1;}days=toJDN(ny,nm,TERM_DAY[nm])-jb;}else{days=toJDN(y,m,TERM_DAY[m])-jb;}}
  else{if(d>=TERM_DAY[m]){days=jb-toJDN(y,m,TERM_DAY[m]);}else{let pm=m-1,py=y;if(pm<1){pm=12;py=y-1;}days=jb-toJDN(py,pm,TERM_DAY[pm]);}}
  const startAge=Math.max(1,Math.round(days/3));const list=[];
  for(let k=1;k<=8;k++){const s=fwd?(mp.s+k)%10:((mp.s-k)%10+10)%10;const b=fwd?(mp.b+k)%12:((mp.b-k)%12+12)%12;list.push({age:startAge+(k-1)*10,s,b,god:tenGod(dayEl,STEM_EL[s])});}
  return {fwd,startAge,list};
}

function calcMe(){

  const ht=document.getElementById('me-time').value;
  if(!name||!bd){alert('이름과 생년월일을 적어줘랑! 🐯');return;}
  const [y,m,d]=bd.split('-').map(Number);
  const C=computeChart(y,m,d,ht);
  const {yp,mp,dp,hp,cnt,dayEl,total}=C;

  // 십성(일간 제외)
  const gods={비겁:0,식상:0,재성:0,관성:0,인성:0};
  [[yp,0],[mp,0],[dp,1],hp?[hp,0]:null].filter(Boolean).forEach(([p,isDay])=>{
    if(!isDay)gods[tenGod(dayEl,STEM_EL[p.s])]++;gods[tenGod(dayEl,BRANCH_EL[p.b])]++;});
  const inEl=Object.keys(GEN).find(k=>GEN[k]===dayEl);
  const support=cnt[dayEl]+cnt[inEl];const strong=support>=total/2;
  const lacking=ELS.filter(e=>cnt[e]===0);const most=ELS.reduce((a,b)=>cnt[b]>cnt[a]?b:a);
  const yong=lacking.length?lacking[0]:inEl;

  const now=new Date();const cy=now.getFullYear(),cm=now.getMonth()+1,cd=now.getDate();
  const cyp=yearPillar(effYear(cy,cm,cd));const yg=tenGod(dayEl,STEM_EL[cyp.s]);
  const tp=dayPillar(cy,cm,cd);const mpNow=monthPillar(yearPillar(effYear(cy,cm,cd)).s,cm,cd);
  const dseed=`${bd}|${cy}-${cm}-${cd}`,mseed=`${bd}|${cy}-${cm}`;
  const period=(pl,seed)=>{const g=tenGod(dayEl,STEM_EL[pl.s]);const base={인성:70,재성:68,식상:66,비겁:60,관성:58}[g];
    const rel=branchRel(pl.b,dp.b);return {sc:clamp(base+(rel==='합'?10:rel==='충'?-12:0)+Math.round(rand01(seed)*20-10),30,97),g,rel};};
  const daily=period(tp,dseed+'d'),monthly=period(mpNow,mseed+'m');

  const cats=CAT_META.map(c=>{let sc;
    if(c.key==='건강'){sc=clamp(74-lacking.length*6-(strong?0:4)+Math.round(rand01(mseed+'건')*16-8),35,96);}
    else{const g=c.god(gender),nc=gods[g]||0;let base=[50,60,67,72,76][Math.min(nc,4)];if(yg===g)base+=8;base+=Math.round(rand01(mseed+c.key)*16-8);sc=clamp(base,35,97);}
    return {key:c.key,icon:c.icon,sc,txt:CAT_TEXT[c.key][band(sc)]};});

  // 대운 + 12개월
  const DU=daeun(y,m,d,gender,yp,mp,dayEl);
  const age=cy-y;let curDU=null;DU.list.forEach(u=>{if(age>=u.age&&age<u.age+10)curDU=u;});
  const months=[];for(let mm=1;mm<=12;mm++){const ys=yearPillar(effYear(cy,mm,15)).s;const mk=monthPillar(ys,mm,15);const g=tenGod(dayEl,STEM_EL[mk.s]);const rel=branchRel(mk.b,dp.b);months.push({mm,sc:clamp(GOD_BASE[g]+(rel==='합'?10:rel==='충'?-12:0)+Math.round(rand01(bd+cy+'M'+mm)*16-8),30,97),g});}

  // 렌더
  const pillars=[hp?['시주·말년',hp]:['시주·모름',null],['일주·나',dp],['월주·사회',mp],['년주·초년',yp]];

function stemRelation(sa,sb){
  const ea=STEM_EL[sa],eb=STEM_EL[sb];
  if(Math.abs(sa-sb)===5)return {sc:96,type:'천간합(天干合)',lead:'mutual',desc:'두 사람의 본질(일간)이 천간합을 이뤄요. 자석처럼 서로를 끌어당기는, 보기만 해도 설레는 인연이에요. 💫'};
  if(Math.abs(sa-sb)===6)return {sc:58,type:'천간충(天干沖)',lead:'both',desc:'두 일간이 팽팽히 맞서는 충의 기운. 불꽃 튀는 매력이 있지만 자존심 싸움은 금물! 한 발씩 양보하면 오히려 단단해져요.'};
  if(ea===eb)return {sc:80,type:'비화(比和)',lead:'mutual',desc:'같은 오행이라 취향·속도가 잘 맞아요. 편한 친구 같은 사이지만, 너무 닮아 가끔 부딪히기도 해요.'};
  if(GEN[ea]===eb)return {sc:88,type:'상생(相生)',lead:'A',desc:'한 사람이 다른 사람을 북돋아 키워주는 생(生)의 관계예요. 다정하게 이끌어주는 따뜻한 궁합! 🌱'};
  if(GEN[eb]===ea)return {sc:88,type:'상생(相生)',lead:'B',desc:'한 사람이 다른 사람을 북돋아 키워주는 생(生)의 관계예요. 서로 기대며 함께 자라나는 사이. 🌱'};
  if(CON[ea]===eb)return {sc:66,type:'상극(相剋)',lead:'A',desc:'한쪽이 주도권을 쥐고 이끄는 극(剋)의 관계예요. 균형만 맞으면 든든하지만 배려가 필요해요.'};
  if(CON[eb]===ea)return {sc:66,type:'상극(相剋)',lead:'B',desc:'한쪽이 주도권을 쥐고 이끄는 극(剋)의 관계예요. 존중이 있으면 안정적인 커플이에요.'};
  return {sc:72,type:'중립',lead:'mutual',desc:'무난하게 어울리는 관계예요.'};
}
function branchHarmony(a,b,spouse){
  const w=spouse?'배우자 자리':'궁';
  if(a===b)return {sc:78,type:'동주(同)',desc:`${w}가 같아 생활 리듬·가치관이 비슷해요. 편안하지만 새로움은 스스로 만들어야 해요.`};
  if((a+6)%12===b)return {sc:52,type:'충(沖)',desc:`${w}끼리 충이라 티격태격·변동이 잦을 수 있어요. 대화로 풀면 오히려 서로를 이해하며 성장해요.`};
  if(SIXHAP[a]===b)return {sc:95,type:'육합(六合)',desc:`${w}가 육합! 자연스럽게 마음이 통하고 안정감을 주는 최고의 조합이에요. 💞`};
  if(inSamhap(a,b))return {sc:90,type:'삼합(三合)',desc:`삼합 인연으로 손발이 척척, 함께일수록 시너지가 나요.`};
  if(inPairs(HAE,a,b))return {sc:62,type:'해(害)',desc:`사소한 서운함이 쌓이기 쉬우니 표현을 자주 해요.`};

  return {sc:73,type:'평범',desc:`특별한 충돌 없이 무난히 어울려요.`};
}
function zodiacHarmony(a,b){

  if(SIXHAP[a]===b)return {sc:94,type:'육합 띠',desc:`${na}띠와 ${nb}띠는 육합! 예로부터 찰떡궁합으로 꼽히는 조합이에요.`};
  if(inSamhap(a,b))return {sc:90,type:'삼합 띠',desc:`${na}띠와 ${nb}띠는 삼합! 서로를 밀어주는 좋은 띠 궁합이에요.`};
  return {sc:72,type:'무난',desc:`${na}띠와 ${nb}띠는 무난하게 어울리는 사이예요.`};

function elementComplement(ca,cb){
  let need=0,fill=0;const filledFor=[];
  ELS.forEach(e=>{if(ca[e]===0){need++;if(cb[e]>=1){fill++;filledFor.push('B가 A의 '+e);}}});
  ELS.forEach(e=>{if(cb[e]===0){need++;if(ca[e]>=1){fill++;filledFor.push('A가 B의 '+e);}}});
  const sc=need===0?82:clamp(Math.round(50+(fill/need)*45),40,97);
  let desc;
  if(need===0)desc='두 사람 모두 오행이 고루 갖춰져 각자 자립적이면서도 조화로워요.';
  else if(fill/need>=0.6)desc='한쪽에 부족한 기운을 상대가 든든히 채워주는 <b>보완형 궁합</b>이에요. 함께 있으면 서로 완전해지는 느낌! 🧩';
  else if(fill/need>0)desc='일부 기운은 서로 채워주지만, 함께 부족한 부분도 있어요. 그 부분은 둘이 의식적으로 노력하면 좋아요.';
  else desc='비슷한 기운이 강해 닮은 점이 많아요. 다만 둘 다 부족한 오행이 겹치니 그 영역은 함께 보완해요.';
  return {sc,desc};
}

function requestCoupleAI(ctx){
  const prompt=`당신은 '은정도사'라는 이름의, 따뜻하고 귀여운 말투를 쓰는 호랑이 도사입니다. 아래 두 사람의 사주 궁합을 한국어로 친근하지만 알맹이 있게 풀이해 주세요. ①두 사람 각각의 성향 ②궁합 총평 ③연애할 때 조언 ④결혼·장기관계 조언 ⑤갈등을 줄이는 팁 순서로 6~8문단.
${ctx.na}(${ctx.ga}) 일주:${ctx.sa}
${ctx.nb}(${ctx.gb}) 일주:${ctx.sb}
궁합 종합점수:${ctx.total} / 세부:${ctx.dim}`;
  callClaude(prompt,null,document.getElementById('aiOutC'),event.target);
}
function callClaude(prompt,system,out,btn){
  btn.disabled=true;out.textContent='🔮 은정도사가 열심히 풀이하는 중...';
  fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,system,max_tokens:1600})})
    .then(r=>r.json()).then(data=>{out.textContent=data.text||('오류: '+(data.error||'응답 없음'));})
    .catch(e=>{out.textContent='요청 실패: '+e.message;}).finally(()=>{btn.disabled=false;});
}
function copyResult(id){const t=document.getElementById(id).innerText;const done=()=>{document.getElementById('bubble').textContent='복사 완료다랑! 📋';};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fbCopy(t,done));}else fbCopy(t,done);}
function fbCopy(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){alert('복사가 안 돼요 ㅠ');}document.body.removeChild(ta);}

const EVENT_TIP={이사:'이사는 나와 충(沖)이 없고, 특히 일지와 육합·삼합을 이루는 날이 편안해요.',결혼:'결혼·상견례는 서로를 생(生)하고 합(合)하는 날이 화목함을 불러와요.',개업:'개업·창업은 재물 기운이 살아나고 충이 없는 날이 길해요.',계약:'중요한 계약은 기운이 안정되고 충·형이 없는 날이 안전해요.',여행:'여행·출발은 충이 없는 순한 날이 무탈해요.',시험:'시험·면접은 머리가 맑고 충이 없는 날에 실력이 잘 나와요.'};
function taekScore(myS,myEl,myB,dp){
  let sc=60;const rs=[];const dEl=STEM_EL[dp.s];
  if(Math.abs(dp.s-myS)===5){sc+=15;rs.push('천간합 🌟');}
  else if(Math.abs(dp.s-myS)===6){sc-=15;rs.push('천간충 ⚡');}
  else if(GEN[dEl]===myEl||GEN[myEl]===dEl){sc+=8;rs.push('상생');}
  else if(CON[dEl]===myEl){sc-=8;rs.push('기운 눌림');}
  const br=branchRel(dp.b,myB);
  if(br==='합'){sc+=15;rs.push('일지 육합 💞');}
  else if(br==='충'){sc-=18;rs.push('일지 충 ⚠️');}
  else if(inSamhap(dp.b,myB)){sc+=12;rs.push('삼합 🤝');}
  else if(inPairs(HAE,dp.b,myB)){sc-=8;rs.push('해(害)');}
  else if(inPairs(PA,dp.b,myB)){sc-=6;rs.push('파(破)');}
  if(!rs.length)rs.push('무난');
  return {sc:clamp(sc,10,99),rs};
}
function calcTaekil(){
  const bd=document.getElementById('taek-bd').value;const ev=document.getElementById('taek-event').value;const ym=document.getElementById('taek-ym').value;
  if(!bd){alert('내 생년월일을 적어줘랑!');return;}
  if(!ym){alert('언제쯤인지 골라줘랑!');return;}
  const [by,bm,bdd]=bd.split('-').map(Number);const me=dayPillar(by,bm,bdd);const myEl=STEM_EL[me.s];
  const [Y,M]=ym.split('-').map(Number);const daysIn=new Date(Y,M,0).getDate();
  const DOW=['월','화','수','목','금','토','일'];const list=[];
  for(let dd=1;dd<=daysIn;dd++){const dp=dayPillar(Y,M,dd);const r=taekScore(me.s,myEl,me.b,dp);
    list.push({dd,dow:DOW[((toJDN(Y,M,dd))%7+7)%7],dp,sc:r.sc,rs:r.rs});}
  const sorted=[...list].sort((a,b)=>b.sc-a.sc);
  const good=sorted.slice(0,6);const bad=sorted.filter(x=>x.sc<45).slice(-3).reverse();
  const card=(x,bad)=>{const col=bcol(x.sc);return `<div class="mini${bad?' bad':''}"><div class="hd"><span class="nm">${M}월 ${x.dd}일 (${x.dow})</span><span class="sc" style="color:${col}">${x.sc}</span></div><div class="st" style="color:${col}">${stars(x.sc)} <span style="font-size:11px;color:var(--sub)">일진 ${gz(x.dp)}</span></div><div class="ds">${x.rs.join(' · ')}</div></div>`;};
  document.getElementById('result-taekil').innerHTML=`
    <div class="sec taek"><h4><span class="em">🍀</span> ${Y}년 ${M}월 좋은 날 TOP 6 <span class="sm">${ev}</span></h4>
      <div class="grid2">${good.map(x=>card(x,false)).join('')}</div>
      <p class="txt" style="margin-top:12px">${EVENT_TIP[ev]}</p></div>
    ${bad.length?`<div class="sec taek"><h4><span class="em">🚫</span> 이런 날은 피해요</h4><div class="grid2">${bad.map(x=>card(x,true)).join('')}</div></div>`:''}
    <div class="sec"><h4><span class="em">💡</span> 참고</h4><p class="txt">내 사주의 일간·일지와 그날 일진의 <b>합·충·생극</b> 관계로 점수를 매겼어요. 실제 택일은 시간(시주)·손없는날 등도 함께 보지만, 일진 궁합만으로도 좋은 흐름의 날을 고를 수 있어요. 🐾</p></div>`;
  saveInputs();
  document.getElementById('result-taekil').scrollIntoView({behavior:'smooth',block:'start'});
}

  s+=`<text x="205" y="430" font-size="13" fill="#a294ad">${esc(d.year)}</text>`;
  let by=500;s+=`<text x="55" y="${by-12}" font-size="15" font-weight="800" fill="#5b4a63">분야별 운세</text>`;
  d.cats.forEach((c,i)=>{const row=Math.floor(i/2),col=i%2;const x=55+col*275;const y=by+row*42;const bc=bh4(c.sc);
    s+=`<text x="${x}" y="${y+13}" font-size="13" font-weight="700" fill="#6b5c72">${esc(c.k)}</text>`;
    s+=`<rect x="${x+50}" y="${y+2}" width="150" height="12" rx="6" fill="#eee4f0"/><rect x="${x+50}" y="${y+2}" width="${Math.round(150*c.sc/100)}" height="12" rx="6" fill="${bc}"/>`;
    s+=`<text x="${x+210}" y="${y+13}" font-size="12" font-weight="800" fill="${bc}">${c.sc}</text>`;});
  const ly=by+3*42+26;
  s+=`<rect x="40" y="${ly}" width="520" height="66" rx="16" fill="#ffffff" opacity="0.72"/>`;
  s+=`<text x="${W/2}" y="${ly+27}" font-size="14" font-weight="800" text-anchor="middle" fill="#5b4a63">🍀 행운 아이템</text>`;
  s+=`<text x="${W/2}" y="${ly+50}" font-size="13" text-anchor="middle" fill="#6b5c72">색 ${esc(d.lucky.color)}  ·  방향 ${esc(d.lucky.dir)}  ·  숫자 ${esc(d.lucky.num)}</text>`;
  s+=`<text x="${W/2}" y="${H-22}" font-size="11" text-anchor="middle" fill="#b7aac0">은정도사 · 재미로 보는 사주 🐾</text></svg>`;
  return s;
}
function makeCoupleCard(d){
  const W=600,H=580;let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  s+=`<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0f6"/><stop offset="0.55" stop-color="#f3ecff"/><stop offset="1" stop-color="#eafaf3"/></linearGradient>
    <linearGradient id="pk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8fab"/><stop offset="1" stop-color="#b79cf0"/></linearGradient></defs>`;
  s+=`<rect width="${W}" height="${H}" rx="30" fill="url(#bg)"/>`;
  s+=`<text x="${W/2}" y="60" font-size="28" text-anchor="middle">🐯</text>`;
  s+=`<text x="${W/2}" y="96" font-size="24" font-weight="800" text-anchor="middle" fill="#5b4a63">은정도사 궁합</text>`;
  s+=`<text x="${W/2}" y="128" font-size="18" font-weight="700" text-anchor="middle" fill="#ff6f91">${esc(d.na)}  💗  ${esc(d.nb)}</text>`;
  s+=`<circle cx="${W/2}" cy="228" r="66" fill="url(#pk)"/><text x="${W/2}" y="228" font-size="44" font-weight="800" text-anchor="middle" fill="#fff">${d.total}</text><text x="${W/2}" y="256" font-size="15" text-anchor="middle" fill="#fff">점</text>`;
  const hn=clamp(Math.round(d.total/20),1,5);s+=`<text x="${W/2}" y="330" font-size="22" text-anchor="middle">${'💖'.repeat(hn)}</text>`;
  s+=`<text x="${W/2}" y="360" font-size="17" font-weight="800" text-anchor="middle" fill="#ff6f91">${esc(d.band)}</text>`;
  d.dims.forEach((c,i)=>{const y=392+i*40;const bc=bh4(c.sc);
    s+=`<text x="80" y="${y+13}" font-size="14" font-weight="700" fill="#6b5c72">${esc(c.k)}</text>`;
    s+=`<rect x="200" y="${y+2}" width="250" height="13" rx="6" fill="#eee4f0"/><rect x="200" y="${y+2}" width="${Math.round(250*c.sc/100)}" height="13" rx="6" fill="${bc}"/>`;
    s+=`<text x="${W-70}" y="${y+13}" font-size="13" font-weight="800" fill="${bc}">${c.sc}</text>`;});
  s+=`<text x="${W/2}" y="${H-20}" font-size="11" text-anchor="middle" fill="#b7aac0">은정도사 · 재미로 보는 궁합 🐾</text></svg>`;
  return s;
}
function downloadPNG(svg,filename){
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();
  img.onload=function(){const sc=2;const cv=document.createElement('canvas');cv.width=(img.naturalWidth||600)*sc;cv.height=(img.naturalHeight||600)*sc;
    const c=cv.getContext('2d');c.scale(sc,sc);c.drawImage(img,0,0);URL.revokeObjectURL(url);
    try{cv.toBlob(function(b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(a.href),1500);document.getElementById('bubble').textContent='이미지 저장 완료다랑! 🖼';});}
    catch(e){alert('이미지 저장이 막혔어요 ㅠ 인쇄 기능을 이용해줘랑');}};
  img.onerror=function(){alert('이미지 생성 실패 ㅠ 인쇄 기능을 이용해줘랑');};
  img.src=url;
}
function saveMeImage(){if(!window._me){alert('먼저 운세를 봐줘랑! 🐯');return;}downloadPNG(makeMeCard(window._me),'은정도사_사주.png');}
function saveCoupleImage(){if(!window._couple){alert('먼저 궁합을 봐줘랑! 💑');return;}downloadPNG(makeCoupleCard(window._couple),'은정도사_궁합.png');}

loadInputs();initChat();
